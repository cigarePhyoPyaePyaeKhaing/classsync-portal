# Server Configuration
server.port=${PORT:3000}

# Database Configuration (Aiven MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRES_IN:24h}

# Google OAuth2 Client Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_CALLBACK_URL}

# Brevo Email Configuration
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=${BREVO_SENDER_NAME}

# Resend Email Configuration
resend.api.key=${RESEND_API_KEY}
resend.from=${RESEND_FROM}

# Additional Environment Configurations
app.backend.url=${BACKEND_URL}
app.callback.url=${CALLBACK_URL}
app.session.secret=${SESSION_SECRET}
app.email.user=${EMAIL_USER}
app.email.pass=${EMAIL_PASS}